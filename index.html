<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212325">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atril">
<title>Atril · Banda Municipal de Ágreda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--negro:#212325;--oscuro:#303335;--oscuro2:#3d4044;--oro:#d4aa48;--oro2:#ebd8ac;--oro3:#f7f0de;--crema:#f0f0f1;--papel:#ffffff;
  --linea:#e2e3e4;--texto:#26282b;--gris:#7d8389;--gris2:#adb1b5;--verde:#4e6b2e;--rojo:#a33a2c;--azul:#d0a236;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --sombra:0 1px 2px rgba(33,35,37,.05),0 6px 20px rgba(33,35,37,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--crema);color:var(--texto);font-family:var(--sans);font-size:16px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:var(--sans);font-size:16px;color:var(--texto)}
.oculto{display:none!important}
.app{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:96px}

/* Acceso */
.login{min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#3f4246 0%,var(--negro) 70%);color:var(--oro2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center}
.login img{width:118px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.login .eti{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--oro);margin-top:26px}
.login h1{font-family:var(--serif);font-size:58px;font-weight:600;color:#ffffff;line-height:1;margin-top:6px}
.login p{color:#b7babd;font-size:15px;margin-top:10px}
.login label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);margin:36px 0 10px}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:56px;height:64px;border-radius:14px;border:1px solid rgba(212,170,72,.4);background:rgba(255,255,255,.04);color:#ffffff;font-size:28px;text-align:center;font-family:var(--serif);font-weight:700;outline:none}
.pin input:focus{border-color:var(--oro);background:rgba(212,170,72,.08)}
.login .error{color:#f0a493;font-size:14px;margin-top:14px;min-height:20px}
.btn-oro{width:100%;max-width:300px;padding:16px;border-radius:14px;background:linear-gradient(180deg,#ddbd70,var(--oro));color:var(--negro);font-weight:600;font-size:16px;box-shadow:0 8px 24px rgba(212,170,72,.25)}
.login small{display:block;margin-top:18px;color:#8f949a;font-size:12.5px}

/* Cabecera */
.cab{background:linear-gradient(170deg,var(--negro),var(--oscuro2));color:var(--oro2);padding:calc(18px + env(safe-area-inset-top)) 22px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.cab::before{content:"";position:absolute;right:-40px;top:-30px;width:220px;height:220px;background:url(icon-512.png) no-repeat center/contain;opacity:.06}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.marca{display:flex;align-items:center;gap:10px}
.marca img{height:34px}
.marca span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--oro)}
.estado{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid rgba(212,170,72,.35);color:var(--oro2);white-space:nowrap}
.estado.aviso{background:var(--oro);color:var(--negro);border-color:var(--oro);font-weight:600}
.cab h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;color:#ffffff;margin-top:20px;position:relative}
.cab .sub{color:#c6c9cc;font-size:14px;margin-top:6px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(212,170,72,.14);border:1px solid rgba(212,170,72,.35);color:var(--oro2);font-size:13px;font-weight:500}
.volver{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:var(--oro2)}
main{padding:0 18px}
h2.sec{font-family:var(--serif);font-weight:600;font-size:23px;margin:28px 4px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2.sec small{font-family:var(--sans);font-size:13px;color:var(--gris);font-weight:500}
.vacio{color:var(--gris);text-align:center;padding:30px 18px;font-size:15px;line-height:1.5;background:var(--papel);border:1px dashed var(--linea);border-radius:18px}

/* Tarjetas */
.proximo{margin-top:-14px;background:var(--papel);border-radius:22px;box-shadow:var(--sombra);border:1px solid var(--linea);overflow:hidden;position:relative;z-index:2}
.proximo .top{padding:18px 20px 14px;display:flex;gap:16px;align-items:center}
.fechab{width:58px;flex:none;text-align:center;border-radius:14px;background:var(--oscuro);color:var(--oro2);padding:8px 0 9px}
.fechab.ensayo{background:var(--azul);color:#f5ebd4}
.fechab b{display:block;font-family:var(--serif);font-size:28px;line-height:1;color:#ffffff}
.fechab span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.proximo .eti{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);font-weight:600}
.proximo h3{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;margin-top:2px}
.proximo .hora{color:var(--gris);font-size:13.5px;margin-top:3px}
.obra{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--linea);cursor:pointer}
.obra:active{background:var(--oro3)}
.icobra{width:44px;height:56px;flex:none;border-radius:6px;background:#fff;border:1px solid var(--linea);display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--oro);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.obra .info{flex:1;min-width:0}
.obra .t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obra .s{font-size:13px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nuevo{font-size:10px;font-weight:700;letter-spacing:.1em;background:var(--oro);color:var(--negro);border-radius:6px;padding:3px 7px;margin-left:6px;vertical-align:2px}
.flecha{color:var(--gris2);font-size:22px}
.offl{font-size:11px;color:var(--verde);font-weight:600}
.programa{background:var(--papel);border:1px solid var(--linea);border-radius:18px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer}
.programa .t{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.15}
.programa .s{font-size:13px;color:var(--gris);margin-top:2px}
.lista{background:var(--papel);border:1px solid var(--linea);border-radius:18px;overflow:hidden;margin-top:12px}
.lista>.obra:first-child{border-top:0}
.buscar{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--linea);background:#fff;outline:none;margin-top:18px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:18px;padding:18px;margin-bottom:12px}
.tarjeta h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:8px}
.tarjeta p{font-size:14.5px;line-height:1.6;color:#404346;white-space:pre-line}
.dato{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--linea);font-size:14.5px}
.dato:last-child{border:0}
.dato span{color:var(--gris)}
.instalar{display:flex;align-items:center;gap:12px;background:var(--oro3);border:1px solid #ebd8ac;border-radius:16px;padding:12px 14px;margin-top:16px;font-size:14px}
.instalar b{display:block}
.instalar button{margin-left:auto;background:var(--oscuro);color:var(--oro2);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}

/* Visor */
.visor{position:fixed;inset:0;background:#2e3033;z-index:20;display:flex;flex-direction:column}
.visor .barra{background:var(--negro);color:var(--oro2);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px}
.visor .tit{flex:1;min-width:0}
.visor .tit b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visor .tit span{font-size:12px;color:#aaaeb3}
.icono{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--oro2);flex:none}
.pestanas{display:flex;background:var(--negro);padding:0 12px 10px;gap:6px}
.pestanas button{flex:1;padding:9px;border-radius:10px;font-size:14px;font-weight:600;color:#9ba0a4}
.pestanas button.on{background:var(--oscuro2);color:var(--oro2)}
.hojas{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;position:relative}
.hojas::-webkit-scrollbar{display:none}
.diapo{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:flex-start;justify-content:center;gap:10px;padding:12px 10px 96px;overflow-y:auto;overflow-x:hidden}
.hoja{background:#fff;border-radius:3px;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:hidden;flex:none}
.hoja canvas{display:block;width:100%;height:100%}
.diapo.fin{align-items:center;padding-bottom:110px}
.hojas.con-repro .diapo{padding-bottom:380px}
.visor.actuacion .diapo{padding:0;align-items:center}
.visor.actuacion .hoja{border-radius:0;box-shadow:none}
.aviso-visor{max-width:520px;margin:40px auto;background:var(--papel);border-radius:18px;padding:24px;text-align:center;line-height:1.5}
.contador{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:rgba(33,35,37,.88);color:var(--oro2);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;opacity:0;transition:opacity .35s;pointer-events:none;z-index:2;white-space:nowrap}
.contador.ver{opacity:1}
.visor.actuacion .contador{display:block!important;bottom:calc(14px + env(safe-area-inset-bottom))}
.herr{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;background:rgba(33,35,37,.94);border:1px solid rgba(212,170,72,.25);border-radius:20px;display:flex;justify-content:space-around;padding:8px}
.herr button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--oro2);font-size:10.5px;padding:6px 8px;border-radius:12px;min-width:58px}
.herr button span{font-size:19px;line-height:1}
.herr button.prox{opacity:.4}
.sobre{flex:1;overflow:auto;background:var(--crema);padding:20px 18px 40px}
.repro{position:absolute;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;background:rgba(33,35,37,.97);border:1px solid rgba(212,170,72,.3);border-radius:18px;padding:12px 14px;color:var(--oro2);z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.repro .r1{display:flex;align-items:center;gap:12px}
.repro .play{width:48px;height:48px;border-radius:50%;background:var(--oro);color:var(--negro);font-size:20px;flex:none;display:grid;place-items:center}
.repro .rt{flex:1;min-width:0}
.repro .rt b{display:block;font-size:14.5px;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repro .rt span{font-size:12px;color:#aaaeb3}
.repro input[type=range]{width:100%;margin:10px 0 6px;accent-color:var(--oro)}
.repro .r3{display:flex;gap:6px;flex-wrap:wrap}
.repro .r3 button{padding:7px 11px;border-radius:10px;background:var(--oscuro2);font-size:13px;font-weight:600;color:var(--oro2)}
.repro .r3 button.on{background:var(--oro);color:var(--negro)}
.repro .cerrar{width:34px;height:34px;border-radius:10px;font-size:18px;color:#aaaeb3;flex:none}
.ytmini{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-top:10px}
.ytmini iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.repro.peq .ytmini{width:58%;padding-top:32.6%;margin-left:auto}
.visor.noche,.visor.noche .hojas{background:#000}
.visor.noche .hoja{background:#000;box-shadow:none}
.visor.noche .hoja canvas{filter:invert(1) hue-rotate(180deg) brightness(.85)}
.visor.actuacion .barra,.visor.actuacion .pestanas,.visor.actuacion #herr,.visor.actuacion #vCambio{display:none!important}
.flotante{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:4;display:none;gap:6px}
.visor.actuacion .flotante{display:flex}
.flotante button{width:44px;height:44px;border-radius:12px;background:rgba(33,35,37,.7);color:var(--oro2);font-size:18px}
.siguiente{width:100%;max-width:420px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--oscuro);color:var(--oro2);border-radius:16px;padding:16px 18px;cursor:pointer}
.siguiente b{font-family:var(--serif);font-size:20px;color:#ffffff;display:block}
.siguiente span{font-size:12px;color:#aaaeb3}
.cambio{margin:10px 12px 0;background:#f5ebd4;color:#c1942d;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.vienes{padding:14px 20px;border-top:1px solid var(--linea);background:#fcf9f2}
.vienes .q{font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vienes .q small{font-weight:500;color:var(--gris);font-size:12.5px}
.vbtn{display:flex;gap:8px;margin-top:10px}
.vbtn button{flex:1;padding:11px 6px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;font-weight:600;font-size:14px}
.vbtn button.si.on{background:var(--verde);border-color:var(--verde);color:#fff}
.vbtn button.no.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.vbtn button.duda.on{background:var(--oro);border-color:var(--oro);color:var(--negro)}
.vcom{font-size:12.5px;color:var(--gris);margin-top:8px}
.vcom a{color:var(--oscuro);text-decoration:underline;cursor:pointer}
.pres{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;white-space:nowrap}
.pres.Sí{background:#e7efdc;color:var(--verde)}.pres.No{background:#f6dcd6;color:var(--rojo)}.pres.Duda{background:var(--oro3);color:#cc9d30}.pres.falta{background:var(--oro);color:var(--negro)}
.repro .rt .ppm{font-family:var(--serif);font-size:34px;color:#ffffff;line-height:1;font-weight:600}
.repro .rt .ppm small{font-size:16px;color:var(--oro);margin-right:4px}
.metro .luz{width:16px;height:16px;border-radius:50%;background:#424649;flex:none}
.metro .luz.on{background:var(--oro)}
.metro .luz.fuerte{background:#fff}
.tramos{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.tramos button{white-space:nowrap;padding:7px 10px;border-radius:10px;background:var(--oscuro2);font-size:12.5px;color:var(--oro2)}
.tramos button.on{background:var(--oro);color:var(--negro)}
.tabla-res{width:100%;border-collapse:collapse;font-size:14px}
.tabla-res td{padding:9px 4px;border-top:1px solid var(--linea);vertical-align:middle}
.barrita{height:8px;border-radius:9px;background:var(--crema);overflow:hidden;min-width:60px}
.barrita i{display:block;height:100%;background:var(--verde)}
.fila-tempo{display:grid;grid-template-columns:70px 70px 70px 1fr 34px;gap:6px;margin-bottom:6px}
.fila-tempo input{padding:10px 8px;border-radius:10px;border:1px solid var(--linea);width:100%;min-width:0}
.video{display:flex;gap:14px;align-items:center;padding:10px;border-radius:14px;background:var(--crema);margin-top:10px;text-decoration:none;color:inherit}
.video .play{width:64px;height:44px;border-radius:10px;background:var(--oscuro);display:grid;place-items:center;color:#ffffff;font-size:16px;flex:none}
.video b{font-size:14.5px;display:block}
.video span{font-size:12.5px;color:var(--gris)}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin-top:10px;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Paneles */
.velo{position:fixed;inset:0;background:rgba(17,18,18,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--papel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:sube .22s ease}
@keyframes sube{from{transform:translateY(30px);opacity:.4}}
.panel .asa{width:42px;height:5px;border-radius:9px;background:var(--linea);margin:0 auto 14px}
.panel h3{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 4px 4px}
.panel p.s{font-size:13.5px;color:var(--gris);margin:0 4px 12px}
.opcion{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:13px 8px;border-radius:14px}
.opcion:active{background:var(--crema)}
.opcion .ic{width:42px;height:42px;border-radius:12px;background:var(--oro3);display:grid;place-items:center;font-size:18px;flex:none}
.opcion b{display:block;font-size:15.5px;font-weight:600}
.opcion span{font-size:13px;color:var(--gris)}
.opcion.on .ic{background:var(--oscuro);color:var(--oro2)}
.grupo-papel{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin:14px 8px 4px;font-weight:600}

/* Formularios */
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin:0 4px 6px;font-weight:600}
.campo input,.campo textarea,.campo select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--linea);background:#fff;outline:none}
.campo textarea{min-height:90px;resize:vertical;line-height:1.5}
.campo input:focus,.campo textarea:focus{border-color:var(--oro)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn.negro{background:var(--oscuro);color:var(--oro2)}
.btn.oro{background:var(--oro);color:var(--negro)}
.btn.linea{background:#fff;border:1px solid var(--linea)}
.btn.rojo{color:var(--rojo)}
.btn.ancho{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.sw{width:46px;height:28px;border-radius:99px;background:var(--linea);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--oro)}
.sw.on::after{left:21px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;font-size:14.5px;cursor:pointer}
.pillita{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--crema);color:var(--gris);margin:2px 4px 2px 0}
.pillita.ok{background:#e7efdc;color:var(--verde)}
.pillita.oro{background:var(--oro3);color:#cc9d30}
.cita{padding:12px 20px 14px;border-top:1px solid var(--linea);display:grid;gap:10px}
.cita-fila{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:baseline;gap:10px}
.cita-et{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);font-weight:600}
.cita-hora{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1;color:var(--texto)}
.cita-hora small{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--gris);margin-left:8px}
.unif{display:flex;flex-wrap:wrap;gap:6px}

<script>
'use strict';
/* =================== Utilidades =================== */
var API = window.ATRIL_API || '';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function toast(t, ms) { var e = $('toast'); e.textContent = t; e.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('ver'); }, ms || 2800); }
function cargando(si, txt) { $('cargando').textContent = txt || 'Un momento…'; $('cargando').classList.toggle('oculto', !si); }
var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function fecha(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function hoyIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function cuando(p) { var d = fecha(p.fecha); return DIAS[d.getDay()].replace(/^./, function (c) { return c.toUpperCase(); }) + ' ' + d.getDate() + ' ' + MESES[d.getMonth()] + (p.hora ? ' · ' + p.hora : '') + (p.lugar ? ' · ' + p.lugar : ''); }
function b64aBytes(b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function bytesAb64(bytes) { var s = '', T = 0x8000; for (var i = 0; i < bytes.length; i += T) s += String.fromCharCode.apply(null, bytes.subarray(i, i + T)); return btoa(s); }

/* =================== Almacén del aparato (IndexedDB) =================== */
var db = null;
function abrirDB() {
  return new Promise(function (ok) {
    try {
      var r = indexedDB.open('atril', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); r.result.createObjectStore('pdf'); };
      r.onsuccess = function () { db = r.result; ok(); };
      r.onerror = function () { ok(); };
    } catch (e) { ok(); }
  });
}
function idb(store, modo, fn) {
  return new Promise(function (ok, ko) {
    if (!db) return ok(undefined);
    var tx = db.transaction(store, modo), st = tx.objectStore(store), req = fn(st);
    tx.oncomplete = function () { ok(req && req.result); };
    tx.onerror = function () { ko(tx.error); };
  });
}
var guardado = {
  get: function (k, s) { return idb(s || 'kv', 'readonly', function (st) { return st.get(k); }); },
  put: function (k, v, s) { return idb(s || 'kv', 'readwrite', function (st) { return st.put(v, k); }); },
  del: function (k, s) { return idb(s || 'kv', 'readwrite', function (st) { return st.delete(k); }); },
  claves: function (s) { return idb(s || 'kv', 'readonly', function (st) { return st.getAllKeys(); }); }
};


/* =================== Diálogos propios (sustituyen a confirm/prompt) =================== */
function dialogo(titulo, texto, campo, okTxt, peligro) {
  if (window.DIALOGO_AUTO) return Promise.resolve(campo ? (DIALOGO_AUTO.texto !== undefined ? DIALOGO_AUTO.texto : campo.valor) : DIALOGO_AUTO.confirmar !== false);
  return new Promise(function (fin) {
    var d = $('dlg');

function descargarMias() {

      return Promise.all(quiero.map(function (p) { return guardado.get(p.id, 'pdf').then(function (x) { return x && x.version === p.version ? null : p; }); }));
    });
  }).then(function (faltan) {

    }

/* ---- Citación, uniforme y avisos urgentes ---- */
var UNIFORME = ['Polo', 'Camisa', 'Corbata', 'Americana', 'Abrigo'];
function unirY(l) { return l.length < 2 ? l.join('') : l.slice(0, -1).join(', ') + ' y ' + l[l.length - 1]; }
function textoUniforme(l) { return unirY((l || []).map(function (x, i) { return i ? x.toLowerCase() : x; })); }
function hace(iso) {
  if (!iso) return ''; var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'ahora mismo'; if (m < 60) return 'hace ' + m + ' min'; if (m < 60 * 24) return 'hace ' + Math.round(m / 60) + ' h';
  var d = new Date(iso); return 'el ' + d.getDate() + ' ' + MESES[d.getMonth()];
}
function bloqueCita(p) {
  if (!p.citacion && !(p.uniforme || []).length) return '';

    (p.citacion ? '<div class="cita-fila"><span class="cita-et">Citación</span><div class="cita-hora">' + esc(p.citacion) + '<small>' + esc(p.lugarCitacion || p.lugar || '') + (p.hora ? (p.lugarCitacion || p.lugar ? ' · ' : '') + 'empieza ' + esc(p.hora) : '') + '</small></div></div>' : '') +
    ((p.uniforme || []).length ? '<div class="cita-fila"><span class="cita-et">Uniforme</span><div class="unif">' + p.uniforme.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div></div>' : '') + '</div>';
}
function bannerUrgente(p, conTitulo) {
  var l = p.urgentes || (p.urgente ? [p.urgente] : []);
  if (!l.length || p.fecha < hoyIso()) return '';
  // Varios avisos del mismo programa: todos a la vista, el más reciente arriba
  return '<button class="urgente" data-prog="' + p.id + '"><div class="u-et"><span>⚠ ' + (l.length > 1 ? l.length + ' avisos urgentes' : 'Aviso urgente') + '</span><span>' + hace(l[0].fecha) + '</span></div>' +
    l.map(function (a, k) { return '<div class="u-tx' + (k ? ' u-viejo' : '') + '">' + (l.length > 1 ? '<small>' + hora24(a.fecha) + '</small> ' : '') + esc(a.texto) + '</div>'; }).join('') +
    (conTitulo ? '<div class="u-pr">' + esc(p.titulo) + ' · ' + esc(cuando(p)) + '</div>' : '') + '</button>';
}
function hora24(iso) { var d = new Date(iso); return isNaN(d) ? '' : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function abrirUrgente(idProg) {
  var p = A.programas.find(function (x) { return x.id === idProg; }); if (!p) return;
  var sel = (p.uniforme || []).slice(), tocado = false;
  function textoAuto() {
    var cambia = sel.slice().sort().join() !== (p.uniforme || []).slice().sort().join();
    return cambia && sel.length ? 'Cambio de uniforme: hoy vamos con ' + textoUniforme(sel).toLowerCase() + '.' : '';
  }
  panel('<h3>⚠ Aviso urgente</h3><p class="s">' + esc(p.titulo) + ' · ' + esc(cuando(p)) + '</p>' +
    (p.tipo === 'Ensayo' ? '' : '<div class="campo"><label>¿Cambia el uniforme?</label><div class="selchips" id="uSel">' + UNIFORME.map(function (x) { return '<button data-u="' + x + '" class="' + (sel.indexOf(x) > -1 ? 'on' : '') + '">' + x + '</button>'; }).join('') + '</div></div>') +
    '<div class="campo"><label>Mensaje</label><textarea id="uTxt" placeholder="Hoy cambiamos a abrigo · Llegad 10 minutos antes · …"></textarea></div>' +
    '<p style="font-size:13px;color:var(--gris);margin:0 4px 14px;line-height:1.45">' + (A.avisosListos ? 'Llegará al momento como notificación urgente a toda la banda, menos a quien ha dicho que no va. También quedará fijo arriba en Atril.' : 'Las notificaciones aún no están configuradas: el aviso se verá fijo arriba en Atril, pero no saltará en los móviles.') + '</p>' +
    '<button class="btn rojo ancho" id="uEnviar">⚠ Enviar aviso urgente</button>');
  $('uTxt').oninput = function () { tocado = !!this.value.trim(); };
  if ($('uSel')) $('uSel').onclick = function (e) {
    var b = e.target.closest('[data-u]'); if (!b) return;
    var i = sel.indexOf(b.dataset.u); if (i > -1) sel.splice(i, 1); else sel.push(b.dataset.u);
    sel = UNIFORME.filter(function (x) { return sel.indexOf(x) > -1; }); b.classList.toggle('on', sel.indexOf(b.dataset.u) > -1);
    if (!tocado) $('uTxt').value = textoAuto();
  };
  $('uEnviar').onclick = function () {
    var t = $('uTxt').value.trim(); if (!t) return toast('Escribe el aviso');
    var cambia = sel.slice().sort().join() !== (p.uniforme || []).slice().sort().join();
    cerrarPanel(); cargando(true, 'Enviando aviso urgente…');
    api('urgente', { programa: p.id, texto: t, uniforme: cambia ? sel : undefined }).then(function (r) {
      return cargarAdmin().then(function () { return sincronizar(false); }).then(function () {
        cargando(false);
        toast(r.sinConfigurar ? 'Aviso puesto en Atril (las notificaciones no están configuradas)' : 'Aviso urgente enviado a ' + r.enviados + ' aparatos' + (r.sinAvisos ? ' · ' + r.sinAvisos + ' músicos sin avisos activados' : ''), 5500);
        if (vista === 'vDir') editarPrograma(p.id);
        var pa = A.programas.find(function (x) { return x.id === p.id; });
        preguntar('¿Mandarlo también al grupo de WhatsApp?', 'Por si alguien no tiene los avisos activados.', 'Abrir WhatsApp').then(function (ok) { if (ok && pa && pa.urgente) whatsapp(textoUrgente(pa)); });
      });
    }).catch(function (e) { cargando(false); toast(e.message, 5000); });

/* ---- ¿Vienes? ---- */

function bloqueVienes(p) {

    }).join('') + '</div>' +

function pildoraVienes(p) {

function responderVienes(idProg, respuesta, comentario) {

  }).then(function () {

  }).catch(function (e) { toast(e.message === 'Failed to fetch' ? 'Necesitas conexión para responder' : e.message, 4000); });

/* =================== Biblioteca =================== */
function pintarBiblio(q) {

function accionPdf(acc, movil) {
  if (acc === 'correo') {
    if (!yo().correo) { toast('Pon tu correo en el Perfil'); $('visor').classList.add('oculto'); return ir('vPerfil'); }
    cargando(true, 'Enviando…');
    return api('correo', { id: parteActual.id }).then(function () { cargando(false); toast('Enviado a ' + yo().correo + ' ✓'); })
      .catch(function (e) { cargando(false); toast(e.message === 'Failed to fetch' ? 'Necesitas conexión para enviarlo' : e.message, 4000); });
  }
  blobActual().then(function (blob) {
    var url = URL.createObjectURL(blob);
    if (acc === 'compartir') {
      var f = new File([blob], nombrePdf(), { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f], title: nombrePdf() }).catch(function () {});
      return toast('Este aparato no permite compartir archivos; usa Descargar');
    }
    if (acc === 'imprimir' && !movil) {
      var ifr = $('impresion'); ifr.onload = function () { try { ifr.contentWindow.focus(); ifr.contentWindow.print(); } catch (e) { window.open(url); } }; ifr.src = url; return;
    }
    var a = document.createElement('a'); a.href = url; a.download = nombrePdf();
    if (acc === 'imprimir') { a.removeAttribute('download'); a.target = '_blank'; }
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }).catch(function () { toast('No se ha podido abrir la partitura'); });
}

}

    var CG = ['', 'Dirección musical', 'Presidencia', 'Vicepresidencia', 'Secretaría', 'Tesorería', 'Vocal'];
    panel('<h3>' + esc(u.nombre) + '</h3><p class="s">Cargo en la banda y permisos en Atril</p>' +
      '<div class="campo"><label>Cargo en la banda</label><div class="selchips" id="pCargo">' + CG.map(function (c) { return '<button data-cg="' + c + '" class="' + ((u.cargo || '') === c ? 'on' : '') + '">' + (c || 'Ninguno') + '</button>'; }).join('') + '</div>' +
      '<p style="font-size:12.5px;color:var(--gris);margin:8px 2px 0">Al nombrar a alguien de la junta, ya puede mandar avisos y noticias. Si el cargo lo tenía otra persona, se le quita.</p></div>' +
      '<div class="campo"><label>Permisos en Atril</label>' + R.map(function (r) {
      return '<button class="opcion' + (u.rol === r[0] ? ' on' : '') + '" data-r="' + r[0] + '"><div class="ic">' + (u.rol === r[0] ? '✓' : { 'Músico': '♪', 'Junta directiva': '✉', 'Administrador': '★' }[r[0]]) + '</div><div><b>' + r[0] + '</b><span>' + r[1] + '</span></div></button>';
    }).join('') + '</div>');
    $('pCargo').onclick = function (e) {
      var c = e.target.closest('[data-cg]'); if (!c || c.dataset.cg === (u.cargo || '')) return;
      cerrarPanel(); cargando(true);
      api('cambiarCargo', { id: u.id, cargo: c.dataset.cg }).then(function (r) {
        return cargarAdmin().then(function () { return sincronizar(false); }).then(function () {
          cargando(false); dirMusicos($('fMus').value);
          toast(u.nombre.split(' ')[0] + ': ' + (r.cargo || 'sin cargo') + (r.relevos && r.relevos.length ? ' · releva a ' + r.relevos.join(', ') : '') + ' ✓', 4500);
        });
      }).catch(function (e) { cargando(false); toast(e.message, 4500); });
    };
    $('panel').querySelectorAll('[data-r]').forEach(function (o) { o.onclick = function () {
      cerrarPanel(); if (o.dataset.r === u.rol) return;
      cargando(true); api('cambiarRol', { id: u.id, rol: o.dataset.r }).then(function () { u.rol = o.dataset.r; cargando(false); toast(u.nombre.split(' ')[0] + ': ' + o.dataset.r + ' ✓'); dirMusicos($('fMus').value); })
        .catch(function (e) { cargando(false); toast(e.message, 4500); });
    }; });
  }; });
  $('listaMus').querySelectorAll('[data-nc]').forEach(function (b) { b.onclick = function () {
    var u = A.usuarios.find(function (x) { return x.id === b.dataset.nc; });
    preguntar('¿Código nuevo para ' + u.nombre + '?', 'El anterior dejará de funcionar.', 'Dar código nuevo').then(function (ok) { if (!ok) return;
    api('nuevoCodigo', { id: u.id }).then(function (r) { u.codigo = r.codigo; toast('Nuevo código: ' + r.codigo); dirMusicos($('fMus').value); }).catch(function (e) { toast(e.message); }); });
  }; });
}

arrancar();
</script>
</body>
</html>
